[project]
name = "jal-backend"
version = "0.1.0"
description = "India water-crisis intelligence platform (working name) - backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0.30",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "anthropic[bedrock]>=0.70",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "boto3>=1.35",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "cachetools>=5.5",
    "rasterio>=1.4",
    "numpy>=2",
    "indic-transliteration>=2.3.82",
    "rapidfuzz>=3.14.6",
    "pdfplumber>=0.11.10",
]

[project.optional-dependencies]
indic = [
    "indictranstoolkit>=1.1.1",
    "pytesseract>=0.3.13",
    "sentencepiece>=0.2.2",
    "torch>=2.14.1",
    "transformers<5",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp -p no:cacheprovider"

[tool.uv]
package = false
