services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: jal
      POSTGRES_PASSWORD: jal
      POSTGRES_DB: jal
    # Host port 5433: a local PostgreSQL install already owns 5432 on this machine.
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jal"]
      interval: 5s
      retries: 10
volumes:
  pgdata: {}
